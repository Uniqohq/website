name: Website CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.WEBSITE_ASSETS_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.WEBSITE_ASSETS_TOKEN || github.token }}

      - name: Package release
        run: tar --exclude='.git' --exclude='node_modules' --exclude='.next' -czf "$RUNNER_TEMP/website-release.tar.gz" .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT || 22 }}" "$RUNNER_TEMP/website-release.tar.gz" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/uniqo-website-${{ github.sha }}.tar.gz"

      - name: Deploy release
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "/bin/bash /srv/uniqo/infrastructure/current/scripts/deploy-website.sh /tmp/uniqo-website-${{ github.sha }}.tar.gz ${{ github.sha }}"
